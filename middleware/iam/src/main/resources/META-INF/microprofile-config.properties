# ---------------- IAM (iam.war) configuration - MicroProfile Config ----------------
# Any key can be overridden by an environment variable: gp.iam.admin.password -> GP_IAM_ADMIN_PASSWORD

# Jakarta NoSQL / Eclipse JNoSQL (MongoDB). Note: the provider key is jnosql.document.provider
jnosql.document.database=greenpilot_iam
jnosql.mongodb.url=mongodb://localhost:27017
jnosql.document.provider=org.eclipse.jnosql.databases.mongodb.communication.MongoDBDocumentConfiguration

# Tokens
gp.jwt.issuer=http://iam.greenpilot.local:8080/iam
gp.jwt.audience=greenpilot
gp.iam.access-token-ttl=900
gp.iam.refresh-token-ttl=604800

# First start only
gp.iam.admin.username=admin@greenpilot.local
gp.iam.admin.password=admin123

# The PWA (public client, PKCE). Redirect URIs must match exactly.
gp.iam.pwa.client-id=greenpilot-pwa
gp.iam.pwa.redirect-uris=http://localhost:8080/greenpilot/live-demo.html,http://localhost:5500/callback.html,http://localhost:5501/callback.html,http://user.greenpilot.local:5500/callback.html,http://admin.greenpilot.local:5501/callback.html

gp.cors.origin=http://user.greenpilot.local:5500,http://admin.greenpilot.local:5501,http://localhost:5500,http://localhost:5501
