# ---------------- GreenPilot API (greenpilot.war) configuration - MicroProfile Config ----------------
# Any key can be overridden by an environment variable: gp.mqtt.url -> GP_MQTT_URL (set in setup/env.ps1)

# Jakarta NoSQL / Eclipse JNoSQL (MongoDB). Note: the provider key is jnosql.document.provider
jnosql.document.database=greenpilot
jnosql.mongodb.url=mongodb://localhost:27017
jnosql.document.provider=org.eclipse.jnosql.databases.mongodb.communication.MongoDBDocumentConfiguration

# Access tokens issued by the IAM (verified with its public keys)
gp.jwt.issuer=http://iam.greenpilot.local:8080/iam
gp.jwt.audience=greenpilot
gp.iam.jwks-url=http://iam.greenpilot.local:8080/iam/jwks

# MQTT v5 broker. Paho only accepts ssl:// (not mqtts://) for TLS.
gp.mqtt.url=ssl://localhost:8883
gp.mqtt.client-id=greenpilot-backend
gp.mqtt.username=backend
gp.mqtt.password=backend-dev-password
gp.mqtt.truststore.password=changeit
# gp.mqtt.truststore.path is set by setup/env.ps1 (tools/certs/truststore.p12)
gp.mqtt.shared-group=greenpilot-backend
gp.mqtt.session-expiry=3600

# Business parameters
gp.command.ttl=60
gp.stale-after=180
gp.cors.origin=http://user.greenpilot.local:5500,http://admin.greenpilot.local:5501,http://localhost:5500,http://localhost:5501
